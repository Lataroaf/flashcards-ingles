<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Flashcards Inglés</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:16px;color:#1d1d1f}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:11px;font-size:14px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:12px;background:#fff;color:#6e6e73;cursor:pointer}
.tab.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.scroll-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 14px;font-size:12px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:20px;background:#fff;color:#6e6e73;cursor:pointer;flex-shrink:0}
.pill.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid #e5e5ea}
.stat-n{font-size:24px;font-weight:600;color:#1d1d1f}
.stat-l{font-size:11px;color:#6e6e73;margin-top:2px}
.progress{width:100%;height:5px;background:#e5e5ea;border-radius:3px;margin-bottom:14px;overflow:hidden}
.progress-fill{height:100%;background:#1d1d1f;border-radius:3px;transition:width .3s}
.card{background:#fff;border-radius:20px;border:1px solid #e5e5ea;padding:28px 20px 22px;text-align:center;margin-bottom:14px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card-top{font-size:11px;color:#6e6e73;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card-cat{font-size:11px;background:#f2f2f7;color:#6e6e73;padding:3px 10px;border-radius:10px;margin-bottom:10px;display:inline-block}
.card-word{font-size:36px;font-weight:600;color:#1d1d1f;margin-bottom:4px;line-height:1.1}
.card-pron{font-size:15px;color:#8e8e93;margin-bottom:6px;font-style:italic}
.speak-btn{background:none;border:1.5px solid #d1d1d6;border-radius:20px;padding:5px 14px;font-size:12px;color:#6e6e73;cursor:pointer;margin-bottom:4px;display:inline-flex;align-items:center;gap:5px}
.speak-btn:active{background:#f2f2f7}
.card-hint{font-size:13px;color:#aeaeb2}
.result{font-size:14px;font-weight:500;margin-top:10px;padding:6px 16px;border-radius:10px;display:inline-block}
.ok{background:#d1f5e0;color:#1c7c3e}
.no{background:#ffe0e0;color:#c0392b}
.streak{text-align:center;font-size:13px;font-weight:500;color:#ff9500;background:#fff8e6;padding:5px 14px;border-radius:10px;margin-bottom:10px;display:inline-block}
.input-row{display:flex;gap:8px;margin-bottom:10px}
.input-row input{flex:1;padding:13px 14px;font-size:16px;border:1.5px solid #d1d1d6;border-radius:12px;background:#fff;color:#1d1d1f;outline:none;-webkit-appearance:none}
.input-row input:focus{border-color:#1d1d1f}
.btn{padding:13px 18px;font-size:15px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:12px;background:#1d1d1f;color:#fff;cursor:pointer}
.btn-sec{width:100%;padding:11px;font-size:13px;color:#6e6e73;border:1.5px solid #d1d1d6;border-radius:12px;background:#fff;cursor:pointer;margin-bottom:6px}
.verb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.vbtn{padding:8px 13px;font-size:12px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:10px;background:#fff;color:#6e6e73;cursor:pointer}
.vbtn.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
#streak-wrap,#streak-wrap-b{text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <h1>Flashcards Inglés</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchSection('vocab')">Vocabulario</button>
    <button class="tab" onclick="switchSection('verbs')">Verbos</button>
  </div>

  <div id="section-vocab">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="pill active" id="mode-en" onclick="setMode('en')" style="text-align:center">Inglés → Español</button>
      <button class="pill" id="mode-es" onclick="setMode('es')" style="text-align:center">Español → Inglés</button>
    </div>
    <div class="scroll-row" id="cat-btns"></div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="v-c">0</div><div class="stat-l">Bien</div></div>
      <div class="stat"><div class="stat-n" id="v-w">0</div><div class="stat-l">Error</div></div>
      <div class="stat"><div class="stat-n" id="v-r">—</div><div class="stat-l">Quedan</div></div>
    </div>
    <div class="progress"><div class="progress-fill" id="v-prog" style="width:0%"></div></div>
    <div id="streak-wrap"></div>
    <div class="card">
      <div class="card-top" id="v-badge">inglés</div>
      <div class="card-cat" id="v-cat"></div>
      <div class="card-word" id="v-word">—</div>
      <div class="card-pron" id="v-pron"></div>
      <button class="speak-btn" id="v-speak" onclick="speakWord()" style="display:none">&#9654; Escuchar</button>
      <div class="card-hint" id="v-hint">¿Cómo se dice en español?</div>
      <div id="v-res"></div>
    </div>
    <div class="input-row">
      <input id="v-in" type="text" placeholder="Tu respuesta..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="btn" onclick="checkV()">OK</button>
    </div>
    <button class="btn-sec" onclick="skipV()">Saltar esta carta</button>
  </div>

  <div id="section-verbs" style="display:none">
    <div class="verb-row">
      <button class="vbtn active" id="vt-all" onclick="setVT('all')">Todos</button>
      <button class="vbtn" id="vt-reg" onclick="setVT('regular')">Regulares</button>
      <button class="vbtn" id="vt-irr" onclick="setVT('irregular')">Irregulares</button>
    </div>
    <div class="verb-row">
      <button class="vbtn active" id="tn-past" onclick="setTense('past')">Pasado (V2)</button>
      <button class="vbtn" id="tn-pp" onclick="setTense('pp')">Participio (V3)</button>
      <button class="vbtn" id="tn-inf" onclick="setTense('inf')">Infinitivo</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="b-c">0</div><div class="stat-l">Bien</div></div>
      <div class="stat"><div class="stat-n" id="b-w">0</div><div class="stat-l">Error</div></div>
      <div class="stat"><div class="stat-n" id="b-r">—</div><div class="stat-l">Quedan</div></div>
    </div>
    <div class="progress"><div class="progress-fill" id="b-prog" style="width:0%"></div></div>
    <div id="streak-wrap-b"></div>
    <div class="card">
      <div class="card-top" id="b-badge">verbo</div>
      <div class="card-word" id="b-word">—</div>
      <div class="card-pron" id="b-pron"></div>
      <button class="speak-btn" id="b-speak" onclick="speakVerb()" style="display:none">&#9654; Escuchar</button>
      <div class="card-hint" id="b-hint" style="font-size:12px;color:#aeaeb2;margin-top:8px"></div>
      <div id="b-res"></div>
    </div>
    <div class="input-row">
      <input id="b-in" type="text" placeholder="Tu respuesta..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="btn" onclick="checkB()">OK</button>
    </div>
    <button class="btn-sec" onclick="skipB()">Saltar esta carta</button>
  </div>
</div>

  {i:'like',p:'liked',pp:'liked',pr_i:'laik',pr_p:'laikt',es:'gustar',t:'regular'},
  {i:'decide',p:'decided',pp:'decided',pr_i:'dih-SAID',pr_p:'dih-SAI-ded',es:'decidir',t:'regular'},
  {i:'change',p:'changed',pp:'changed',pr_i:'chaynj',pr_p:'chayjnd',es:'cambiar',t:'regular'},
  {i:'live',p:'lived',pp:'lived',pr_i:'liv',pr_p:'livd',es:'vivir',t:'regular'},
  {i:'smile',p:'smiled',pp:'smiled',pr_i:'smail',pr_p:'smaild',es:'sonreír',t:'regular'},
  {i:'laugh',p:'laughed',pp:'laughed',pr_i:'laf',pr_p:'laft',es:'reír',t:'regular'},
  {i:'cry',p:'cried',pp:'cried',pr_i:'krai',pr_p:'kraid',es:'llorar',t:'regular'},
  {i:'dance',p:'danced',pp:'danced',pr_i:'dans',pr_p:'danst',es:'bailar',t:'regular'},
  {i:'achieve',p:'achieved',pp:'achieved',pr_i:'uh-CHEEV',pr_p:'uh-CHEEVD',es:'lograr/alcanzar',t:'regular'},
  {i:'manage',p:'managed',pp:'managed',pr_i:'MAN-ij',pr_p:'MAN-ijd',es:'gestionar/lograr',t:'regular'},
  {i:'improve',p:'improved',pp:'improved',pr_i:'im-PRUV',pr_p:'im-PRUVD',es:'mejorar',t:'regular'},
  {i:'suggest',p:'suggested',pp:'suggested',pr_i:'suh-JEST',pr_p:'suh-JES-ted',es:'sugerir',t:'regular'},
  {i:'argue',p:'argued',pp:'argued',pr_i:'AR-gyoo',pr_p:'AR-gyood',es:'discutir/argumentar',t:'regular'},
];

const cats=['Todas',...new Set(V.map(w=>w.c))];
let selCat='Todas',vMode='en';
let vQ=[],vRev=[],vC=0,vW=0,vStr=0,vTot=0,vCur=null,vShowing=false;
let bType='all',bTense='past';
let bQ=[],bRev=[],bC=0,bW=0,bStr=0,bTot=0,bCur=null,bShowing=false;
let currentSpeakWord='',currentSpeakWordB='';

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u);
}
function speakWord(){speak(currentSpeakWord)}
function speakVerb(){speak(currentSpeakWordB)}

function buildCats(){
  document.getElementById('cat-btns').innerHTML=cats.map(c=>
    `<button class="pill${c===selCat?' active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}
function setCat(c){selCat=c;buildCats();initV()}
function getPool(){return selCat==='Todas'?V:V.filter(w=>w.c===selCat)}

function initV(){
  vQ=shuf([...getPool()]);vRev=[];vC=0;vW=0;vStr=0;vTot=vQ.length;
  updV();nextV();
}
function setMode(m){
  vMode=m;
  document.getElementById('mode-en').classList.toggle('active',m==='en');
  document.getElementById('mode-es').classList.toggle('active',m==='es');
  initV();
}
function nextV(){
  if(vRev.length>0&&(vQ.length===0||Math.random()<0.3)){vCur=vRev.shift();}
  else if(vQ.length>0){vCur=vQ.shift();if(vRev.length>0)shuf(vRev);}
  else{
    vCur=null;
    document.getElementById('v-word').textContent='¡Completado!';
    document.getElementById('v-badge').textContent='';
    document.getElementById('v-cat').textContent='';
    document.getElementById('v-pron').textContent='';
    document.getElementById('v-speak').style.display='none';
    document.getElementById('v-hint').textContent='Repasaste todas las palabras';
    document.getElementById('v-res').innerHTML='';return;
  }
  const isEN=vMode==='en';
  const word=isEN?vCur.en:vCur.es;
  currentSpeakWord=vCur.en;
  document.getElementById('v-badge').textContent=isEN?'inglés':'español';
  document.getElementById('v-cat').textContent=vCur.c;
  document.getElementById('v-word').textContent=word;
  document.getElementById('v-pron').textContent=isEN?'/'+vCur.pr+'/':'';
  document.getElementById('v-speak').style.display=isEN?'inline-flex':'none';
  document.getElementById('v-hint').textContent=isEN?'¿Cómo se dice en español?':'¿Cómo se dice en inglés?';
  document.getElementById('v-res').innerHTML='';
  document.getElementById('v-in').value='';
  document.getElementById('v-in').focus();
  vShowing=false;updV();
}
function checkV(){
  if(vShowing){nextV();return;}
  const inp=document.getElementById('v-in').value;
  if(!inp.trim()||!vCur)return;
  const exp=vMode==='en'?vCur.es:vCur.en;
  const alts=exp.split('/').map(norm);
  const ok=alts.some(a=>norm(inp)===a);
  if(ok){vC++;vStr++;document.getElementById('v-res').innerHTML='<span class="result ok">Correcto</span>';}
  else{vW++;vStr=0;vRev.push(vCur);document.getElementById('v-res').innerHTML=`<span class="result no">Era: ${exp}</span>`;}
  updV();vShowing=true;setTimeout(nextV,1400);
}
function skipV(){if(!vCur)return;vRev.push(vCur);nextV();}
function updV(){
  document.getElementById('v-c').textContent=vC;
  document.getElementById('v-w').textContent=vW;
  document.getElementById('v-r').textContent=vQ.length+vRev.length;
  document.getElementById('v-prog').style.width=(vTot>0?Math.round(vC/vTot*100):0)+'%';
  document.getElementById('streak-wrap').innerHTML=vStr>=3?`<span class="streak">Racha: ${vStr}</span>`:'';
}

function initB(){
  const pool=bType==='all'?B:B.filter(v=>v.t===bType);
  bQ=shuf([...pool]);bRev=[];bC=0;bW=0;bStr=0;bTot=bQ.length;
  updB();nextB();
}
function setVT(t){
  bType=t;
  document.getElementById('vt-all').classList.toggle('active',t==='all');
  document.getElementById('vt-reg').classList.toggle('active',t==='regular');
  document.getElementById('vt-irr').classList.toggle('active',t==='irregular');
  initB();
}
function setTense(t){
  bTense=t;
  ['past','pp','inf'].forEach(x=>document.getElementById('tn-'+x).classList.toggle('active',x===t));
  initB();
}
function nextB(){
  let v;
  if(bRev.length>0&&(bQ.length===0||Math.random()<0.3)){v=bRev.shift();}
  else if(bQ.length>0){v=bQ.shift();if(bRev.length>0)shuf(bRev);}
  else{
    bCur=null;
    document.getElementById('b-word').textContent='¡Completado!';
    document.getElementById('b-badge').textContent='';
    document.getElementById('b-pron').textContent='';
    document.getElementById('b-speak').style.display='none';
    document.getElementById('b-hint').textContent='Repasaste todos los verbos';
    document.getElementById('b-res').innerHTML='';return;
  }
  bCur=v;
  let prompt,pron,hint,speakText;
  if(bTense==='past'){
    prompt=v.i;pron='/'+v.pr_i+'/';speakText=v.i;
    hint=`Pasado de "${v.i}" · ${v.es} · ${v.t==='irregular'?'irregular':'reg: añade -ed'}`;
  } else if(bTense==='pp'){
    prompt=v.i;pron='/'+v.pr_i+'/';speakText=v.i;
    hint=`Participio de "${v.i}" · ${v.es}`;
  } else {
    prompt=v.p;pron='/'+v.pr_p+'/';speakText=v.p;
    hint=`Infinitivo · pasado: ${v.p} · ${v.es}`;
  }
  currentSpeakWordB=speakText;
  document.getElementById('b-badge').textContent=v.t;
  document.getElementById('b-word').textContent=prompt;
  document.getElementById('b-pron').textContent=pron;
  document.getElementById('b-speak').style.display='inline-flex';
  document.getElementById('b-hint').textContent=hint;
  document.getElementById('b-res').innerHTML='';
  document.getElementById('b-in').value='';
  document.getElementById('b-in').focus();
  bShowing=false;updB();
}
function checkB(){
  if(bShowing){nextB();return;}
  const inp=document.getElementById('b-in').value;
  if(!inp.trim()||!bCur)return;
  let exp=bTense==='past'?bCur.p:bTense==='pp'?bCur.pp:bCur.i;
  const alts=exp.split('/').map(norm);
  const ok=alts.some(a=>norm(inp)===a);
  if(ok){bC++;bStr++;document.getElementById('b-res').innerHTML='<span class="result ok">Correcto</span>';}
  else{bW++;bStr=0;bRev.push(bCur);document.getElementById('b-res').innerHTML=`<span class="result no">Era: ${exp}</span>`;}
  updB();bShowing=true;setTimeout(nextB,1400);
}
function skipB(){if(!bCur)return;bRev.push(bCur);nextB();}
function updB(){
  document.getElementById('b-c').textContent=bC;
  document.getElementById('b-w').textContent=bW;
  document.getElementById('b-r').textContent=bQ.length+bRev.length;
  document.getElementById('b-prog').style.width=(bTot>0?Math.round(bC/bTot*100):0)+'%';
  document.getElementById('streak-wrap-b').innerHTML=bStr>=3?`<span class="streak">Racha: ${bStr}</span>`:'';
}
function switchSection(s){
  document.getElementById('section-vocab').style.display=s==='vocab'?'':'none';
  document.getElementById('section-verbs').style.display=s==='verbs'?'':'none';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&s==='vocab')||(i===1&&s==='verbs')));
  if(s==='verbs'&&bTot===0)initB();
}
document.getElementById('v-in').addEventListener('keydown',e=>{if(e.key==='Enter')checkV()});
document.getElementById('b-in').addEventListener('keydown',e=>{if(e.key==='Enter')checkB()});
buildCats();initV();
</script>
</body>
</html>
