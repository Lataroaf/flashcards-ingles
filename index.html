<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flashcards Inglés</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:12px 14px 32px}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar h1{font-size:17px;font-weight:600}
.topbar-right{display:flex;gap:8px;align-items:center}
.learned-badge{font-size:12px;font-weight:500;background:#1d1d1f;color:#fff;padding:4px 10px;border-radius:20px}
.menu-btn{background:#fff;border:1.5px solid #d1d1d6;border-radius:10px;padding:6px 10px;font-size:13px;color:#1d1d1f;cursor:pointer}

/* COLLAPSIBLE MENU */
#menu-panel{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:14px;margin-bottom:12px;display:none}
#menu-panel.open{display:block}
.menu-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tab{padding:9px;font-size:13px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:10px;background:#f5f5f7;color:#6e6e73;cursor:pointer}
.tab.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.menu-section{margin-bottom:10px}
.menu-label{font-size:11px;color:#aeaeb2;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.scroll-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:20px;background:#f5f5f7;color:#6e6e73;cursor:pointer;flex-shrink:0}
.pill.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.verb-row{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid #d1d1d6;border-radius:10px;background:#f5f5f7;color:#6e6e73;cursor:pointer}
.vbtn.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}

/* VERB RULE BOX */
.rule-box{background:#f5f5f7;border-radius:10px;padding:10px 12px;font-size:12px;color:#3a3a3a;line-height:1.5;margin-top:8px}
.rule-box strong{font-weight:600;color:#1d1d1f}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:#fff;border-radius:10px;padding:8px 4px;text-align:center;border:1px solid #e5e5ea}
.stat-n{font-size:20px;font-weight:600;color:#1d1d1f}
.stat-l{font-size:10px;color:#6e6e73;margin-top:1px}
.progress{width:100%;height:4px;background:#e5e5ea;border-radius:3px;margin-bottom:10px;overflow:hidden}
.progress-fill{height:100%;background:#1d1d1f;border-radius:3px;transition:width .4s}

/* CARD */
.card{background:#fff;border-radius:20px;border:1.5px solid #e5e5ea;padding:24px 20px 16px;text-align:center;margin-bottom:12px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .2s}
.card.correct{border-color:#34c759}
.card.wrong{border-color:#ff3b30}
.card.revealed{border-color:#007aff}
.card-top{font-size:10px;color:#aeaeb2;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card-cat{font-size:10px;background:#f2f2f7;color:#6e6e73;padding:2px 8px;border-radius:8px;margin-bottom:8px;display:inline-block}
.card-word{font-size:34px;font-weight:600;color:#1d1d1f;line-height:1.1;margin-bottom:3px}
.card-pron{font-size:13px;color:#8e8e93;font-style:italic;margin-bottom:5px;min-height:18px}
.card-hint{font-size:12px;color:#aeaeb2;min-height:16px}
.speak-btn{background:none;border:1.5px solid #e5e5ea;border-radius:20px;padding:4px 12px;font-size:11px;color:#6e6e73;cursor:pointer;margin-bottom:4px;display:inline-flex;align-items:center;gap:4px}
.revealed-word{font-size:22px;font-weight:500;color:#007aff;margin-top:8px;animation:fadeIn .25s ease}
.result-bar{height:32px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.result{font-size:13px;font-weight:500;padding:5px 16px;border-radius:8px;display:inline-block;animation:fadeIn .2s ease}
.ok{background:#d1f5e0;color:#1c7c3e}
.no{background:#ffe0e0;color:#c0392b}
.revealed-ans{background:#e8f0fe;color:#1a56db}
@keyframes fadeIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* STREAK */
#streak-wrap{text-align:center;height:26px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.streak{font-size:12px;font-weight:500;color:#ff9500;background:#fff8e6;padding:4px 12px;border-radius:8px}

/* BUTTONS */
.input-row{display:flex;gap:8px;margin-bottom:8px}
.input-row input{flex:1;padding:12px 14px;font-size:16px;border:1.5px solid #d1d1d6;border-radius:12px;background:#fff;color:#1d1d1f;outline:none;-webkit-appearance:none}
.input-row input:focus{border-color:#1d1d1f}
.btn-ok{padding:12px 16px;font-size:15px;font-weight:600;border:none;border-radius:12px;background:#1d1d1f;color:#fff;cursor:pointer}
.btn-row{display:flex;gap:8px;margin-bottom:4px}
.btn-skip{flex:1;padding:10px;font-size:12px;color:#6e6e73;border:1.5px solid #d1d1d6;border-radius:10px;background:#fff;cursor:pointer}
.btn-dontknow{flex:1;padding:10px;font-size:12px;font-weight:500;color:#ff3b30;border:1.5px solid #ffb3b3;border-radius:10px;background:#fff5f5;cursor:pointer}

/* CONFETTI */
#confetti-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:999}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;animation:fall linear forwards;opacity:0}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="confetti-wrap"></div>
<div id="app">

  <div class="topbar">
    <h1>Flashcards</h1>
    <div class="topbar-right">
      <span class="learned-badge" id="learned-badge">0 aprendidas</span>
      <button class="menu-btn" onclick="toggleMenu()" id="menu-btn-label">Opciones</button>
    </div>
  </div>

  <!-- COLLAPSIBLE MENU -->
  <div id="menu-panel">
    <div class="menu-tabs">
      <button class="tab active" id="tab-vocab" onclick="switchSection('vocab')">Vocabulario</button>
      <button class="tab" id="tab-verbs" onclick="switchSection('verbs')">Verbos</button>
    </div>

    <div id="menu-vocab">
      <div class="menu-section">
        <div class="menu-label">Dirección</div>
        <div class="scroll-row">
          <button class="pill active" id="mode-en" onclick="setMode('en')">Inglés → Español</button>
          <button class="pill" id="mode-es" onclick="setMode('es')">Español → Inglés</button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-label">Categoría</div>
        <div class="scroll-row" id="cat-btns"></div>
      </div>
    </div>

    <div id="menu-verbs" style="display:none">
      <div class="menu-section">
        <div class="menu-label">Tipo</div>
        <div class="verb-row">
          <button class="vbtn active" id="vt-all" onclick="setVT('all')">Todos</button>
          <button class="vbtn" id="vt-reg" onclick="setVT('regular')">Regulares</button>
          <button class="vbtn" id="vt-irr" onclick="setVT('irregular')">Irregulares</button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-label">Modo</div>
        <div class="verb-row">
          <button class="vbtn active" id="tn-past" onclick="setTense('past')">Pasado</button>
          <button class="vbtn" id="tn-pp" onclick="setTense('pp')">Participio</button>
          <button class="vbtn" id="tn-inf" onclick="setTense('inf')">Infinitivo</button>
        </div>
      </div>
      <div class="rule-box" id="rule-box"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-c">0</div><div class="stat-l">Bien</div></div>
    <div class="stat"><div class="stat-n" id="s-w">0</div><div class="stat-l">Error</div></div>
    <div class="stat"><div class="stat-n" id="s-r">—</div><div class="stat-l">Quedan</div></div>
    <div class="stat"><div class="stat-n" id="s-s">0</div><div class="stat-l">Racha</div></div>
  </div>
  <div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div id="streak-wrap"></div>

  <!-- CARD -->
  <div class="card" id="main-card">
    <div class="card-top" id="c-badge"></div>
    <div class="card-cat" id="c-cat"></div>
    <div class="card-word" id="c-word">—</div>
    <div class="card-pron" id="c-pron"></div>
    <button class="speak-btn" id="c-speak" onclick="doSpeak()" style="display:none">&#9654; Escuchar</button>
    <div class="card-hint" id="c-hint"></div>
    <div id="c-revealed"></div>
    <div class="result-bar"><div id="c-res"></div></div>
  </div>

  <div class="input-row">
    <input id="main-in" type="text" placeholder="Tu respuesta..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <button class="btn-ok" onclick="checkAnswer()">OK</button>
  </div>
  <div class="btn-row">
    <button class="btn-skip" onclick="doSkip()">Saltar</button>
    <button class="btn-dontknow" onclick="dontKnow()">No lo sé</button>
  </div>
</div>

// ── STATE ────────────────────────────────────────────────────
const cats=['Todas',...new Set(V.map(w=>w.c))];
let section='vocab', selCat='Todas', vMode='en';
let bType='all', bTense='past';
let queue=[], review=[], correct=0, wrong=0, streak=0, total=0;
let current=null, showing=false, revealed=false;
let learnedSet=new Set(); // words answered correctly at least once

// ── HELPERS ──────────────────────────────────────────────────
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function $(id){return document.getElementById(id)}

function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u);
}
function doSpeak(){
  if(!current)return;
  const word=section==='vocab'?current.en:current.i;
  speak(word);
}

// ── MENU TOGGLE ──────────────────────────────────────────────
function toggleMenu(){
  const p=$('menu-panel');
  const open=p.classList.contains('open');
  p.classList.toggle('open',!open);
  $('menu-btn-label').textContent=open?'Opciones':'Cerrar';
}

// ── CONFETTI ─────────────────────────────────────────────────
const COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#f06595'];
function celebrate(){
  const wrap=$('confetti-wrap');
  wrap.innerHTML='';
  for(let i=0;i<55;i++){
    const d=document.createElement('div');
    d.className='dot';
    const size=6+Math.random()*8;
    d.style.cssText=`left:${Math.random()*100}%;top:-10px;width:${size}px;height:${size}px;background:${COLORS[Math.floor(Math.random()*COLORS.length)]};animation-duration:${0.9+Math.random()*1.3}s;animation-delay:${Math.random()*0.5}s`;
    wrap.appendChild(d);
  }
  setTimeout(()=>wrap.innerHTML='',2800);
}

// ── VERB RULE ─────────────────────────────────────────────────
function updateRule(){
  $('rule-box').innerHTML=RULES[bTense]||'';
}

// ── POOL BUILDERS ─────────────────────────────────────────────
function getVocabPool(){return selCat==='Todas'?V:V.filter(w=>w.c===selCat)}
function getVerbPool(){return bType==='all'?B:B.filter(v=>v.t===bType)}

// ── INIT ──────────────────────────────────────────────────────
function initSession(){
  const pool=section==='vocab'?getVocabPool():getVerbPool();
  queue=shuf([...pool]);review=[];correct=0;wrong=0;streak=0;total=queue.length;
  updStats();next();
}

// ── NEXT CARD ─────────────────────────────────────────────────
function next(){
  $('main-card').className='card';
  $('c-res').innerHTML='';
  $('c-revealed').innerHTML='';
  revealed=false;

  // Pull from review queue ~30% of the time if available
  if(review.length>0&&(queue.length===0||Math.random()<0.3)){current=review.shift();}
  else if(queue.length>0){current=queue.shift();if(review.length>0)shuf(review);}
  else{
    current=null;
    $('c-word').textContent='Completado!';
    $('c-badge').textContent='';$('c-cat').textContent='';
    $('c-pron').textContent='';$('c-speak').style.display='none';
    $('c-hint').textContent='Repasaste todas las palabras';
    return;
  }

  if(section==='vocab'){
    const isEN=vMode==='en';
    $('c-badge').textContent=isEN?'ingles':'espanol';
    $('c-cat').textContent=current.c;
    $('c-word').textContent=isEN?current.en:current.es[0];
    $('c-pron').textContent=isEN?'/'+current.pr+'/':'';
    $('c-speak').style.display=isEN?'inline-flex':'none';
    $('c-hint').textContent=isEN?'Como se dice en espanol?':'Como se dice en ingles?';
  } else {
    let prompt,pron,hint;
    if(bTense==='past'){prompt=current.i;pron='/'+current.pr_i+'/';hint='Pasado de "'+current.i+'" · '+current.es;}
    else if(bTense==='pp'){prompt=current.i;pron='/'+current.pr_i+'/';hint='Participio de "'+current.i+'" · '+current.es;}
    else{prompt=current.p;pron='/'+current.pr_p+'/';hint='Infinitivo · pasado: '+current.p+' · '+current.es;}
    $('c-badge').textContent=current.t;
    $('c-cat').textContent='';
    $('c-word').textContent=prompt;
    $('c-pron').textContent=pron;
    $('c-speak').style.display='inline-flex';
    $('c-hint').textContent=hint;
  }
  $('main-in').value='';
  $('main-in').focus();
  showing=false;updStats();
}

// ── CHECK ─────────────────────────────────────────────────────
function checkAnswer(){
  if(showing){next();return;}
  if(revealed){
    // after "no lo sé" — mark as wrong, re-queue
    wrong++;streak=0;review.push(current);
    $('main-card').className='card wrong';
    $('c-res').innerHTML='<span class="result no">Seguir practicando</span>';
    updStats();showing=true;setTimeout(next,2000);return;
  }
  const inp=$('main-in').value;
  if(!inp.trim()||!current)return;
  let ok=false;
  if(section==='vocab'){
    const alts=vMode==='en'?current.es:[current.en];
    ok=alts.some(a=>norm(inp)===norm(a));
  } else {
    let exp=bTense==='past'?current.p:bTense==='pp'?current.pp:current.i;
    ok=exp.split('/').some(a=>norm(inp)===norm(a));
  }
  if(ok){
    correct++;streak++;
    // Mark as learned (answered correctly at least once)
    const key=section==='vocab'?current.en:current.i;
    learnedSet.add(key);
    $('main-card').className='card correct';
    $('c-res').innerHTML='<span class="result ok">Correcto</span>';
    if(streak%5===0)celebrate();
  } else {
    wrong++;streak=0;review.push(current);
    $('main-card').className='card wrong';
    const exp=section==='vocab'?(vMode==='en'?current.es.join(' / '):current.en):(bTense==='past'?current.p:bTense==='pp'?current.pp:current.i);
    $('c-res').innerHTML=`<span class="result no">Era: ${exp}</span>`;
  }
  updStats();showing=true;setTimeout(next,2500);
}

// ── DON'T KNOW ───────────────────────────────────────────────
function dontKnow(){
  if(showing||!current)return;
  revealed=true;
  $('main-card').className='card revealed';
  let answer='';
  if(section==='vocab'){
    answer=vMode==='en'?current.es.join(' / '):current.en;
  } else {
    if(bTense==='past')answer=current.p;
    else if(bTense==='pp')answer=current.pp;
    else answer=current.i;
  }
  $('c-revealed').innerHTML=`<div class="revealed-word">${answer}</div>`;
  $('c-hint').textContent='Memoriza la palabra y toca OK';
  $('main-in').value='';
}

function doSkip(){if(!current||showing)return;review.push(current);next();}

// ── STATS ─────────────────────────────────────────────────────
function updStats(){
  $('s-c').textContent=correct;
  $('s-w').textContent=wrong;
  $('s-r').textContent=queue.length+review.length;
  $('s-s').textContent=streak;
  const pct=total>0?Math.round(correct/total*100):0;
  $('prog').style.width=pct+'%';
  $('learned-badge').textContent=learnedSet.size+' aprendidas';
  $('streak-wrap').innerHTML=streak>=5?`<span class="streak">Racha de ${streak}</span>`:'';
}

// ── CAT BUTTONS ───────────────────────────────────────────────
function buildCats(){
  $('cat-btns').innerHTML=cats.map(c=>
    `<button class="pill${c===selCat?' active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}
function setCat(c){selCat=c;buildCats();initSession();}
function setMode(m){
  vMode=m;
  $('mode-en').classList.toggle('active',m==='en');
  $('mode-es').classList.toggle('active',m==='es');
  initSession();
}
function setVT(t){
  bType=t;
  $('vt-all').classList.toggle('active',t==='all');
  $('vt-reg').classList.toggle('active',t==='regular');
  $('vt-irr').classList.toggle('active',t==='irregular');
  initSession();
}
function setTense(t){
  bTense=t;
  ['past','pp','inf'].forEach(x=>$('tn-'+x).classList.toggle('active',x===t));
  updateRule();initSession();
}

// ── SECTION SWITCH ────────────────────────────────────────────
function switchSection(s){
  section=s;
  $('tab-vocab').classList.toggle('active',s==='vocab');
  $('tab-verbs').classList.toggle('active',s==='verbs');
  $('menu-vocab').style.display=s==='vocab'?'':'none';
  $('menu-verbs').style.display=s==='verbs'?'':'none';
  initSession();
}

// ── KEYBOARD ──────────────────────────────────────────────────
$('main-in').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});

// ── BOOT ─────────────────────────────────────────────────────
updateRule();buildCats();initSession();
</script>
